/* Uni Space / comprehensive responsive refinement – version 2 */
:root{
 --bg:#f5ebdd;--surface:#fffdfa;--line:#e8dad1;--ink:#292326;
 --muted:#706467;--soft-ink:#5e5255;--accent:#781f32;
 --shadow:0 14px 38px rgba(66,31,37,.065),0 3px 11px rgba(66,31,37,.025);
 --radius:19px;--motion:cubic-bezier(.22,1,.36,1);
}
body{font-size:16px;line-height:1.55;background:#f5ebdd}
.main-column{position:relative;isolation:isolate;background:
 radial-gradient(ellipse 34% 25% at 100% 5%, rgba(142,67,79,.075),transparent 88%),
 radial-gradient(ellipse 31% 38% at 2% 95%,rgba(217,167,119,.095),transparent 86%),
 linear-gradient(135deg,#f6eddf 0%,#f5ebdd 57%,#f8efe6 100%)}
.main-column:before{content:"";position:absolute;top:108px;right:0;width:clamp(180px,22vw,520px);height:clamp(180px,22vw,520px);border:1px solid rgba(120,31,50,.055);border-radius:50%;transform:translate(37%,-13%);pointer-events:none;z-index:-1}
.main-column:after{content:"";position:absolute;top:225px;right:0;width:clamp(130px,16vw,380px);height:clamp(130px,16vw,380px);border:1px solid rgba(120,31,50,.043);border-radius:50%;transform:translate(25%,-5%);pointer-events:none;z-index:-1}
.page{max-width:1850px;margin:0 auto;padding:clamp(34px,2.6vw,58px) clamp(28px,3vw,70px) 96px;animation:uni-page-enter .30s var(--motion) both}
@keyframes uni-page-enter{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.page-head{margin-bottom:32px;align-items:center}
.page-head h1{font-size:clamp(31px,1.62vw,42px);line-height:1.12;margin-bottom:10px;letter-spacing:-.035em}
.page-subtitle{font-size:clamp(15px,.78vw,19px);line-height:1.5}
.eyebrow{font-size:13px;letter-spacing:.08em;margin-bottom:9px}
.page h2{letter-spacing:-.023em}
.section-head h2{font-size:clamp(21px,1.04vw,26px)}
.section-hint{font-size:15px}
.panel{box-shadow:var(--shadow);border-radius:var(--radius);background:rgba(255,254,252,.96)}
.panel-pad{padding:clamp(28px,2vw,38px)}
.muted,.tiny{line-height:1.55}.tiny{font-size:14px}
.btn{min-height:48px;padding:12px 22px;font-size:15px;border-radius:11px;transition:background-color .2s var(--motion),box-shadow .2s var(--motion),transform .2s var(--motion)}
.btn:hover{box-shadow:0 7px 17px rgba(120,31,50,.14);transform:translateY(-1px)}
.btn.small{min-height:45px;padding:10px 18px;font-size:15px}
.plain-link{font-size:16px}.chip{font-size:14px;font-weight:650;padding:6px 11px}
.nav-item{font-size:14px}.avatar,.avatar.big{background:#781f32}.avatar.big{width:76px;height:76px;font-size:21px}
.preview-foot{font-size:13px;max-width:none;margin-top:70px}
/* Scalable, roomier heading and content sections */
.academic-block{margin-top:34px}.academic-block h2{font-size:25px;margin-bottom:17px}
.a-row{padding:17px 26px;min-height:70px;gap:24px}
.a-row.heading{font-size:14px;min-height:54px}
.a-row .discipline{font-size:16px;line-height:1.5}
.score-value{font-size:17px}.score-note{font-size:13px;margin-top:4px}.bar{height:6px;width:min(210px,85%);margin-top:9px}
.a-row .chip{font-size:13px}.academic-summary .mini-stat{min-width:174px}
.mini-stat strong{font-size:29px}.mini-stat span{font-size:14px;max-width:135px}
.academic-block+.academic-block{margin-top:46px!important}
/* Schedule: full-width controls; no tiny left-clustered day selector. */
.schedule-view{width:100%}
.schedule-toolbar{display:grid;grid-template-columns:auto auto minmax(75px,1fr) auto;align-items:center;gap:16px;margin-bottom:15px;padding:18px 22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,254,251,.93);box-shadow:var(--shadow)}
.schedule-toolbar .tabs{margin:0;background:#f5ede8}
.schedule-toolbar .tabs button{font-size:15px;padding:12px 23px;min-height:44px}
.schedule-toolbar .btn{justify-self:start}
.schedule-toolbar .week-nav{justify-self:end;gap:12px}
.schedule-toolbar .week-nav .icon-btn{width:45px;height:45px}
.date-picker-label{display:flex;align-items:center;gap:12px;font-size:15px;color:#685e61;font-weight:650}
.date-input{max-width:195px;min-height:46px;font-size:15px;padding:10px 13px}
.days-picker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:0 0 33px;padding:0;overflow:visible}
.day-choice{min-width:0;width:100%;min-height:83px;padding:11px 5px;background:#fffbf7;gap:6px;border-radius:13px;transition:transform .19s var(--motion),background-color .19s,box-shadow .19s}
.day-choice:hover:not(.active){background:#fff;transform:translateY(-2px);box-shadow:0 7px 18px rgba(66,31,37,.065)}
.day-choice.active{box-shadow:0 9px 19px rgba(120,31,50,.16)}
.day-choice span{font-size:13px}.day-choice strong{font-size:20px}
.schedule-week-list{gap:31px}.day-section h2{font-size:clamp(21px,1vw,26px);margin-bottom:17px;font-weight:760}
.day-section .day-label{font-size:14px;line-height:1.6;font-weight:600;margin-left:2px}
.lesson-list{display:grid;gap:14px}
.lesson{padding:22px 27px;grid-template-columns:minmax(160px,205px) minmax(0,1fr) auto;gap:24px;min-height:116px;align-items:center;border-radius:17px;transition:transform .2s var(--motion),box-shadow .2s var(--motion),border-color .2s}
.lesson:hover{box-shadow:0 11px 23px rgba(66,31,37,.085);transform:translateY(-1px);border-color:#d7bdba}
.lesson .time{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:780;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:0}
.lesson .time time{font:inherit;color:inherit}.lesson .time span{display:inline;margin:0;color:var(--accent);font:inherit;font-weight:780;opacity:.7}
.lesson h3{font-size:18px;margin-bottom:9px}.lesson .info{font-size:15px;gap:9px}
.lesson-tag{justify-self:end}.lesson .chip{font-size:13px}
.schedule-no-lesson{padding:22px 25px;font-size:15px}
/* Services: larger type without oversized block. */
.services-intro{font-size:16px;margin-bottom:20px}
.service-card{padding:24px 28px;gap:24px;min-height:154px}
.service-card h2{font-size:23px;margin-bottom:7px}.service-card p{font-size:16px;line-height:1.5}
.service-icon{width:68px;height:68px}.service-icon.small{width:49px;height:49px}
.service-card .btn{flex-shrink:0}
.services-tabs{position:relative;isolation:isolate;display:flex;width:min(100%,530px);margin-bottom:32px;gap:5px;padding:5px;background:#f2e7e2}
.services-tabs:before{content:"";position:absolute;z-index:0;left:5px;top:5px;bottom:5px;width:calc((100% - 15px)/2);background:var(--accent);border-radius:10px;box-shadow:0 4px 10px #781f3220;transform:translateX(0);transition:transform .29s var(--motion)}
.services-tabs[data-selected="apps"]:before{transform:translateX(calc(100% + 5px))}
.services-tabs a{z-index:1;position:relative;flex:1;min-width:0;background:transparent!important;box-shadow:none!important;border-radius:10px;font-size:15px;min-height:49px;padding:10px 13px;color:#594950;transition:color .2s}
.services-tabs a.active{color:#fff}.services-tabs a:not(.active):hover{background:transparent!important;color:#781f32}
.tab-count{display:inline-flex;align-items:center;justify-content:center;border-radius:20px;background:rgba(120,31,50,.10);color:currentColor;font-size:12px;padding:1px 7px;min-width:23px}
.services-tabs a.active .tab-count{background:#ffffff22}
.app-row{min-height:92px;padding:20px 27px;gap:23px;grid-template-columns:minmax(0,1.4fr) minmax(200px,.7fr) minmax(150px,.6fr) 20px}
.app-row.heading{min-height:51px;font-size:14px}.app-row strong{font-size:17px}.app-row .muted{font-size:15px!important}
.mobile-app h3{font-size:17px}.mobile-app p{font-size:14px}
.empty-state{padding:54px 32px}.empty-state h2{font-size:25px}.empty-state p{font-size:16px;max-width:560px}
.empty-icon{width:70px;height:70px;border-radius:18px}
/* Application details: one coherent reading zone, no floating status */
.detail-view{max-width:1350px;margin:0 auto}.detail-view .page-head{margin-bottom:24px}
.back{font-size:16px;font-weight:750;min-height:43px;margin-bottom:22px;padding:9px 12px 9px 8px;border-radius:9px;transition:background .18s}
.back:hover{background:rgba(120,31,50,.075);text-decoration:none}
.detail-card{padding:clamp(26px,2.3vw,42px)}
.detail-intro{display:flex;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:5px}
.detail-intro h2{font-size:24px;margin:0 0 4px}.detail-intro p{font-size:15px}
.detail-grid{grid-template-columns:minmax(180px,.36fr) minmax(0,1fr);column-gap:28px}
.detail-grid dt,.detail-grid dd{padding:19px 0;line-height:1.5}
.detail-grid dt{font-size:16px}.detail-grid dd{font-size:17px;overflow-wrap:anywhere}
.detail-footer{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}
.detail-footer>span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
/* Profile: use the actual transparent standalone university artwork. */
.profile-view{max-width:1550px;margin:0 auto}
.profile-hero{min-height:214px;padding:29px 35px;margin-bottom:19px!important;overflow:hidden;gap:23px}
.profile-hero:after{display:none}
.profile-hero-copy{position:relative;z-index:2;max-width:64%}
.profile-hero h2{font-size:clamp(24px,1.4vw,31px);margin-bottom:13px}
.profile-meta{font-size:16px;gap:15px}
.profile-building{position:absolute;z-index:1;bottom:-10px;right:0;width:min(59%,740px);height:100%;object-fit:contain;object-position:right bottom;opacity:.80;pointer-events:none;mask-image:linear-gradient(to right,transparent 0%,black 23%)}
.profile-hero .avatar{z-index:2;position:relative;box-shadow:0 4px 14px #781f3221}
.profile-grid{display:grid;grid-template-areas:"personal education" "contacts education";grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:18px;align-items:start}
.profile-card+.profile-card{margin-top:0}
.profile-personal{grid-area:personal}.profile-education{grid-area:education}.profile-contacts{grid-area:contacts}
.profile-card{padding:26px 29px}.profile-card h2{font-size:21px;margin-bottom:18px;gap:11px}
.profile-card dl{grid-template-columns:minmax(135px,.38fr) minmax(0,.62fr)}
.profile-card dt,.profile-card dd{padding:14px 0;font-size:15px;line-height:1.55}
.profile-card dd{font-size:16px;overflow-wrap:anywhere}.profile-empty{padding:8px 0;font-size:16px}
/* Other pages */
.news-feed,.news-article{max-width:1400px}
.news-item{padding:28px 31px}.news-item h2{font-size:21px}.news-item p{font-size:16px}.news-date{font-size:14px}
.news-article{padding:36px 42px}.news-article h1{font-size:34px}.news-article p{font-size:17px}
.form-shell{max-width:960px}.form-card{padding:33px 39px}.form-card h2{font-size:23px}.field label{font-size:16px}.field textarea,.field input{font-size:16px}.field-help{font-size:14px}
.login-card{width:min(100%,500px);padding:43px 45px}.login-card h1{font-size:32px}.login-card .btn{font-size:16px}
/* UI motion: drawers truly slide; backdrop fades. */
.drawer-layer,.mobile-layer{display:block!important;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .28s ease,visibility 0s linear .28s}
.drawer-layer.open,.mobile-layer.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .28s ease,visibility 0s}
.drawer-layer .scrim,.mobile-layer .scrim{opacity:0;transition:opacity .28s ease}
.drawer-layer.open .scrim,.mobile-layer.open .scrim{opacity:1}
.drawer-panel{width:min(520px,100vw);transform:translate3d(104%,0,0);transition:transform .33s var(--motion)}
.drawer-layer.open .drawer-panel{transform:translate3d(0,0,0)}
.mobile-side{transform:translate3d(-105%,0,0);transition:transform .33s var(--motion)}
.mobile-layer.open .mobile-side{transform:translate3d(0,0,0)}
.drawer-head h2{font-size:24px}.drawer-item h3{font-size:18px}.drawer-item p{font-size:15px}.drawer-item time{font-size:13px}
.avatar-menu{animation:uni-menu-enter .2s var(--motion) both}
@keyframes uni-menu-enter{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

function progress(course){
  const value=Number(course[1]);
  const maximum=Number(course[2]);
  if(!Number.isFinite(value)||!Number.isFinite(maximum)||maximum<=0)return '';

}

function applicationFormPage(){if(state.formSubmitted){return wrap(`<a class="back" href="#/services">${icon('left',16)} К каталогу услуг</a>`+header('Заявление создано','Запрос сохранён в демонстрационном режиме','Услуги и документы')+`<div class="panel form-card form-shell"><div class="empty-icon" style="margin:0 0 16px;background:#eaf4e9;color:#347249">${icon('check',26)}</div><h2 style="margin-bottom:10px">Готово! Заявление № ${state.appId}</h2><p class="muted">Вы можете посмотреть детали заявления или вернуться в каталог услуг.</p><div class="form-actions"><a class="btn" href="#/applications/${state.appId}">Открыть заявление</a><a class="btn light" href="#/services?tab=applications">Мои заявления</a></div></div>`)}return wrap(`<a class="back" href="#/services">${icon('left',16)} К каталогу услуг</a>`+header('Справка об обучении','Заполните короткую форму — это займёт меньше минуты','Новое заявление')+`<div class="panel form-card form-shell"><div class="title-inline" style="gap:13px"><span class="service-icon small">${icon('file',22)}</span><div><h2>Данные заявления</h2><p class="muted tiny" style="margin-top:4px">Все поля со звёздочкой обязательны</p></div></div><div class="divider" style="margin:19px 0 6px"></div><div class="field"><label for="place">Место предоставления <span style="color:var(--accent)">*</span></label><textarea id="place" name="place" maxlength="340" placeholder="Например, для предоставления по месту требования">${esc(state.formValue)}</textarea></div><div class="field-help"><span>От 1 до 300 символов</span><span id="chars">${Array.from(state.formValue.trim()).length} / 300</span></div>${state.formError?`<p class="form-error-msg" role="alert">${state.formError}</p>`:''}<div class="form-actions"><button class="btn" data-action="submit-form">Отправить заявление ${icon('arrow',17)}</button><a class="btn light" href="#/services">Отмена</a></div></div>`)}
function applicationDetailPage(id){
  const a=state.apps.find(a=>String(a.id)===String(id));
  if(!a)return wrap(`<div class="detail-view"><a class="detail-back" href="#/services?tab=applications">${icon('left',20)} <span>Мои заявления</span></a><div class="panel empty-state"><h2>Заявление не найдено</h2><p>В макете доступны только демонстрационные заявления.</p></div></div>`);
  return wrap(`<div class="detail-view"><a class="detail-back" href="#/services?tab=applications">${icon('left',20)}<span>Мои заявления</span></a>`+
    header(`Заявление № ${a.id}`,a.title,'Услуги и документы')+
    `<article class="panel detail-card detail-card-v3"><div class="detail-card-head"><div class="detail-intro-v3"><span class="service-icon small">${icon('file',24)}</span><div><h2>${esc(a.title)}</h2><p class="muted">Данные поданного заявления</p></div></div></div><dl class="detail-grid"><dt>Дата подачи</dt><dd>${esc(a.date)}</dd><dt>Место предоставления</dt><dd>${esc(a.place)}</dd><dt>Рассмотрение</dt><dd><span class="chip good"><span class="dot"></span>${esc(a.status)}</span></dd><dt>Документ</dt><dd>${esc(a.doc)}</dd></dl><p class="detail-demo-note">${icon('info',16)} Это демонстрационные данные, не официальный документ.</p></article></div>`);
}

function render(){
  const p=pathOf(); state.avatarOpen=false; state.mobileOpen=false;
  let content;
  const isPublic=p==='/login'||p==='/about';
  if(isPublic)content=publicPage(p.slice(1));
  else{
    let body;
    if(p==='/schedule'||p==='/notifications')body=schedulePage();
    else if(p==='/academics')body=academicsPage();
    else if(p==='/services')body=servicesPage();
    else if(p==='/services/study_certificate')body=applicationFormPage();
    else if(p.startsWith('/applications/'))body=applicationDetailPage(p.split('/')[2]);
    else if(p==='/news')body=newsPage();
    else if(p.startsWith('/news/'))body=newsDetailPage(p.split('/')[2]);
    else if(p==='/profile')body=profilePage();
    else if(p==='/settings')body=settingsPage();
    else body=notFoundPage();
    content=body;
  }
  const mount=document.getElementById('app');
  const main=mount.querySelector('#main-content');
  const preserve=lastRenderedPath===p;
  const oldY=window.scrollY;
  if(!isPublic && main && lastRenderedPath && !['/login','/about'].includes(lastRenderedPath)){
    main.innerHTML=content;
    document.querySelector('.avatar-menu')?.remove();
    document.querySelector('[data-action="avatar-toggle"]')?.setAttribute('aria-expanded','false');
    document.querySelectorAll('.side-nav').forEach(n=>{n.innerHTML=navHtml()});
    if(!preserve)window.scrollTo({top:0,behavior:'instant'});
    else window.scrollTo({top:oldY,behavior:'instant'});
    syncOverlay();
  } else {
    mount.innerHTML=isPublic?content:shell(content);
    window.scrollTo({top:0,behavior:'instant'});
  }
  lastRenderedPath=p;
  const titles={'/schedule':'Расписание','/academics':'Успеваемость','/services':'Услуги и документы','/news':'Новости','/profile':'Мой профиль','/settings':'Настройки','/login':'Вход','/about':'О проекте'};
  document.title=(titles[p]||'Страница')+' · Uni Space';
  if(p==='/notifications'){state.notificationsOpen=true;syncOverlay()}
}
function syncOverlay(){const d=document.querySelector('.drawer-layer');if(d){d.classList.toggle('open',state.notificationsOpen);d.setAttribute('aria-hidden',String(!state.notificationsOpen))}const m=document.querySelector('.mobile-layer');if(m){m.classList.toggle('open',state.mobileOpen);m.setAttribute('aria-hidden',String(!state.mobileOpen))}document.body.style.overflow=state.notificationsOpen||state.mobileOpen?'hidden':''}
function redrawPreserveScroll(){
  const p=pathOf();
  if(p==='/schedule')return refreshSchedule();
  if(p==='/services' && document.querySelector('.services-stage')){
    const temporary=document.createElement('div');temporary.innerHTML=servicesPage();
    const fresh=temporary.querySelector('.services-stage');
    morphContent(document.querySelector('.services-stage'),fresh.innerHTML);
    return;
  }
  const y=window.scrollY;
  let c;
  if(p==='/academics')c=academicsPage();
  else if(p==='/services/study_certificate')c=applicationFormPage();
  else return render();
  const main=document.querySelector('#main-content');
  if(main)main.innerHTML=c;
  window.scrollTo({top:y,behavior:'instant'});
}

let lastRenderedPath=null;
const easeUni='cubic-bezier(.22,1,.36,1)';
function motionReduced(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function morphContent(node,newHTML,nextClass){
  if(!node)return;
  const previousScroll=window.scrollY;
  // Cancel an earlier layout animation when the user clicks repeatedly.
  node.getAnimations().forEach(a=>a.cancel());
  node.style.height='';node.style.overflow='';
  const before=node.getBoundingClientRect().height;
  node.style.height=before+'px';node.style.overflow='hidden';
  node.innerHTML=newHTML;
  if(nextClass)node.className=nextClass;
  const after=node.scrollHeight;
  if(motionReduced()||Math.abs(after-before)<1){node.style.height='';node.style.overflow='';return}
  const anim=node.animate([{height:before+'px'},{height:after+'px'}],{duration:310,easing:easeUni});
  const children=Array.from(node.children);
  children.forEach(el=>el.animate([{opacity:0,transform:'translate3d(0,7px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:265,easing:easeUni}));
  anim.onfinish=()=>{node.style.height='';node.style.overflow='';};
  anim.oncancel=()=>{node.style.height='';node.style.overflow='';};
}
function refreshSchedule(){
  const root=document.querySelector('.schedule-view');
  if(!root)return;
  const draft=document.createElement('div');draft.innerHTML=schedulePage();
  const next=draft.querySelector('.schedule-view');
  const subtitle=root.querySelector('.page-subtitle');
  if(subtitle)subtitle.textContent=next.querySelector('.page-subtitle')?.textContent||'';
  const modeTabs=root.querySelector('.schedule-modes');
  const oldMode=modeTabs.dataset.selected;
  modeTabs.dataset.selected=state.scheduleMode;
  modeTabs.querySelectorAll('[data-action="schedule-mode"]').forEach(button=>{
    const active=button.dataset.value===state.scheduleMode;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  root.querySelector('#schedule-date').value=state.scheduleDate;
  const dateInput=root.querySelector('#schedule-date');
  dateInput.setAttribute('aria-label',`Выбрать ${state.scheduleMode==='week'?'неделю':'дату'}`);
  const dateLabel=root.querySelector('.date-label');
  if(dateLabel)dateLabel.textContent=state.scheduleMode==='week'?'Неделя':'Дата';
  const current=root.querySelector('.schedule-selectors');
  const upcoming=next.querySelector('.schedule-selectors');
  const oldDays=current.querySelectorAll('.day-choice');
  const newDays=upcoming.querySelectorAll('.day-choice');
  const sameWeek=oldMode==='day'&&state.scheduleMode==='day'&&oldDays.length===newDays.length&&[...oldDays].every((d,i)=>d.dataset.value===newDays[i].dataset.value);
  if(sameWeek){
    oldDays.forEach(d=>{
      const active=d.dataset.value===state.scheduleDate;
      d.classList.toggle('active',active);
      d.setAttribute('aria-pressed',String(active));
    });
  }else morphContent(current,upcoming.innerHTML,upcoming.className);
  const target=next.querySelector('.schedule-content');
  morphContent(root.querySelector('.schedule-content'),target.innerHTML,target.className);
}

.avatarOpen=false;document.querySelector('.avatar-menu')?.remove();location.hash='#/login'}});if(!location.hash){location.hash='#/schedule'}else render();

// Animate the services segmented control before the hash route changes.
document.addEventListener('click',function(event){
  const link=event.target.closest('.services-tabs a');
  if(!link || event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;
  const tabs=link.closest('.services-tabs');
  const next=link.hash.includes('applications')?'apps':'catalog';
  if(next===tabs.dataset.selected){event.preventDefault();return}
  event.preventDefault();
  history.pushState({section:'services'},'',link.hash);
  tabs.dataset.selected=next;
  tabs.querySelectorAll('a').forEach(a=>{const selected=a===link;a.classList.toggle('active',selected);a.setAttribute('aria-current',selected?'page':'false')});
  const fresh=document.createElement('div');fresh.innerHTML=servicesPage();
  const current=document.querySelector('.services-stage');
  const target=fresh.querySelector('.services-stage');
  morphContent(current,target.innerHTML);
},true);
window.addEventListener('popstate',()=>{state.notificationsOpen=false;render()});

})();
