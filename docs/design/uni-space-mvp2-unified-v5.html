.teacher-schedule-list .editor-lesson{grid-template-columns:90px minmax(0,1fr)}
.services-tabbar{position:relative;isolation:isolate;overflow:hidden!important}
.services-tabbar::before{content:"";position:absolute;z-index:-1;top:4px;bottom:4px;left:0;width:var(--tab-width,140px);transform:translateX(var(--tab-x,4px));background:var(--accent);border-radius:9px;box-shadow:0 3px 9px rgba(120,31,50,.13);transition:none}
.services-tabbar .tab.active{background:transparent!important;box-shadow:none!important;color:#fff}
.services-tabbar .tab{position:relative;z-index:1;transition:color .2s var(--ease),background .2s var(--ease)}
.ambient:before{animation:ambient-sway 38s ease-in-out infinite alternate}
@keyframes ambient-sway{from{transform:translate3d(-.5%,.25%,0) rotate(-18deg)}to{transform:translate3d(.6%,-.4%,0) rotate(-17deg)}}

.overlay .modal{animation:modal-enter .28s var(--ease)}

/* Keep resource lookup compact until the user searches. */
.editor-search-wrap{position:relative;z-index:4}
.editor-search-results{position:absolute;display:none;left:0;right:0;top:calc(100% + 4px);z-index:12;max-height:190px;box-shadow:0 16px 38px rgba(40,22,28,.13)}
.editor-search-wrap:focus-within .editor-search-results{display:grid}

/* MVP2 v4: stable shell, local-only motion. The approved student MVP1 styles stay unchanged. */
@view-transition { navigation: none; }
::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
.section-page, .editor-day { animation: none !important; }
.ambient::before { animation: none !important; transform: rotate(-18deg) !important; }
/* Smooth shared sliding indicator, matching the existing services control. */
.mvp2-tabs, .mvp2-segmented { position: relative; isolation: isolate; overflow: hidden; }
.mvp2-tabs::before, .mvp2-segmented::before {
  content: ''; position: absolute; z-index: 0;
  top: 4px; bottom: 4px; left: 0;
  width: var(--tab-width, 0px); transform: translateX(var(--tab-x, 4px));
  background: var(--accent); border-radius: 9px;
  box-shadow: 0 3px 9px rgb(120 31 50 / 13%);
  transition: none;
  pointer-events: none;
}
.mvp2-tabs > .tab, .mvp2-segmented > .segment {
  position: relative; z-index: 1;
  background: transparent !important; box-shadow: none !important;
  transition: color 160ms ease !important;
}
.mvp2-tabs > .tab.active, .mvp2-segmented > .segment.active { color: white !important; }
.mvp2-tab-stage, .services-stage { min-width: 0; }
/* 3-4 journal tabs must remain legible on phones and narrow tablet columns. */
.mvp2-tabs {
  display: inline-flex !important;
  width: max-content !important; max-width: 100% !important;
  flex-wrap: nowrap !important;
  overflow-x: auto !important; overflow-y: hidden !important;
  gap: 4px; scrollbar-width: none; overscroll-behavior-x: contain;
}
.mvp2-tabs::-webkit-scrollbar { display: none; }
.mvp2-tabs > .tab { flex: 0 0 auto !important; min-width: max-content !important; padding: 11px 17px !important; }

@media (prefers-reduced-motion: reduce) {
  .mvp2-tabs::before, .mvp2-segmented::before, .services-tabbar::before {transition: none !important;}
  .mvp2-tabs > .tab, .mvp2-segmented > .segment {transition: none !important;}
}

/* The indicator must not slide in from x=4px on initial navigation.
   Activate motion only after its actual selected tab has been measured and painted. */
.services-tabbar.indicator-ready::before,
.mvp2-tabs.indicator-ready::before,
.mvp2-segmented.indicator-ready::before {
  transition: transform 260ms cubic-bezier(.22,1,.36,1), width 260ms cubic-bezier(.22,1,.36,1);
}
/* Teacher schedule intentionally uses exactly the student schedule toolbar/day/list geometry. */
.teacher-schedule-toolbar { padding: 15px; }
.teacher-person-filter { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:0 0 13px; }
.teacher-person-filter label { color:var(--muted); font-size:13px; font-weight:650; }
.teacher-person-filter select { width:min(380px,100%); max-width:100%; }
@media (max-width:760px) {
  .teacher-schedule-toolbar { padding:15px; }

  .teacher-person-filter select { width:100%; }
}
@media (prefers-reduced-motion: reduce) {
  .services-tabbar.indicator-ready::before,
  .mvp2-tabs.indicator-ready::before,
  .mvp2-segmented.indicator-ready::before { transition:none !important; }
}

function renderNav(){return `<aside class="sidebar ${state.collapsed?'collapsed':''} ${state.mobile?'mobile-open':''}" id="sidebar"><div class="brand"><div class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 40 54" fill="none"><path d="M20 3 23 13 20 11 17 13 20 3Z" fill="#e4ac56"/><path d="M20 17V35M12 27l8 8 8-8M5 46l15-8 15 8M10 49l10-8 10 8" stroke="#981e3c" stroke-width="2"/><path d="M20 21c-9 8-11 15-11 22m11-22c9 8 11 15 11 22" stroke="#981e3c" stroke-width="2"/><path d="M17 47h6M11 50h18" stroke="#981e3c" stroke-width="2"/></svg></div><div class="brand-text"><strong>РГУЧВ</strong><small>Российский государственный<br>университет чародейства и<br>волшебства имени А. М.<br>Кашпировского</small></div></div><nav class="navscroll" aria-label="Разделы демонстрации">${nav.map(group=>`<section class="navgroup"><div class="navtitle">${group.group}</div>${group.items.map(([id,label,ico])=>`<a class="navlink ${((state.page===id)|| (id==='services'&&['service-form','applications','application-detail'].includes(state.page))||(id==='news'&&state.page==='news-detail')||(id==='staff-applications'&&state.page==='staff-application-detail')||(id==='admin-users'&&state.page==='admin-detail')||(id==='staff-students'&&state.page==='student-detail'))?'active':''}" href="#${id}" title="${label}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></a>`).join('')}</section>`).join('')}</nav><div class="sidebar-bottom"><button class="collapse-btn" data-action="collapse" type="button">${icon(state.collapsed?'right':'left')}<span class="collapse-text">${state.collapsed?'Развернуть меню':'Свернуть меню'}</span></button></div></aside>`}
function layout(){const un=state.notifications.filter(x=>!x.read).length;return `${state.mobile?'<div class="mobile-shade" data-action="close-mobile"></div>':''}${renderNav()}<div class="shell ${state.collapsed?'collapsed':''}"><div class="ambient"></div><header class="topbar"><button type="button" class="mobile-toggle" data-action="mobile" aria-label="Открыть навигацию">${icon('menu','lg')}</button><span class="prototype-note">Конкурсный прототип<br>Неофициальный сервис</span><button class="notify-trigger" data-action="notifications" aria-label="Уведомления">${icon('bell')}${un?`<span class="count">${un}</span>`:''}<span>Уведомления</span></button><button class="avatar" data-action="avatar" aria-label="Меню пользователя">ИС</button>${state.avatarMenu?`<div class="avatar-menu"><button data-nav="profile">${icon('user','sm')} Мой профиль</button><button data-nav="settings">${icon('settings','sm')} Настройки</button><button data-action="demo-info">${icon('info','sm')} О прототипе</button></div>`:''}</header><main class="view section-page" id="main-content">${renderPage()}${demoFooter}</main></div>${state.drawer?renderDrawer():''}${state.modal?renderModal():''}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}`}
const parseDate=s=>new Date(s+'T12:00:00');
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStart=s=>{let d=parseDate(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const dateShort=s=>parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const dateLong=s=>parseDate(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
function lessonHtml(item){if(!state.showCancelled&&item.status==='cancelled')return '';let cl=item.status||'';return `<article class="lesson ${cl}"><div class="time">${item.time}</div><div class="info"><h3>${esc(item.title)}</h3>${item.status==='moved'?`<a href="#schedule" data-jump-date="${item.to}">Перенесено на ${item.toLabel}</a>`:item.status==='cancelled'?'':`<p>${esc(item.type)} · ${esc(item.room)} · ${esc(item.teacher)}</p>`}</div>${item.status?chip(item.status==='cancelled'?'Отменено':'Перенесено',item.status==='cancelled'?'red':'orange'):''}</article>`}
function dayHtml(d){const list=(lessons[d]||[]).filter(x=>state.showCancelled||x.status!=='cancelled');return `<section><h2 class="schedule-day-title">${dateLong(d)}</h2>${list.length?list.map(lessonHtml).join(''):`<div class="card pad" style="color:var(--muted);text-align:center;padding-block:25px">На этот день занятий нет.</div>`}</section>`}
function schedulePage(){const start=weekStart(state.scheduleDate),days=Array.from({length:7},(_,i)=>addDays(start,i));return header('Расписание',`Неделя ${Math.ceil((parseDate(start)-new Date('2026-01-01T12:00:00'))/604800000)+1} · ${dateShort(start)}–${dateShort(days[6])}`,'УЧЕБНЫЙ КАЛЕНДАРЬ')+`<div class="toolbar"><div class="left"><div class="tabbar"><button class="tab ${state.scheduleMode==='day'?'active':''}" data-mode="day">День</button><button class="tab ${state.scheduleMode==='week'?'active':''}" data-mode="week">Неделя</button></div>${button('Сегодня','today','light small')}</div><div class="right"><button class="btn light icon-only" data-action="prevweek" aria-label="Предыдущая неделя">${icon('left')}</button><button class="btn light icon-only" data-action="nextweek" aria-label="Следующая неделя">${icon('right')}</button><label for="schedule-date" class="muted">Дата</label><input id="schedule-date" class="control" type="date" value="${state.scheduleDate}" style="width:160px"></div></div><div class="row wrap" style="margin:12px 0 17px"><label class="pill-switch"><input id="show-cancelled" type="checkbox" ${state.showCancelled?'checked':''}> Показывать отменённые</label></div><p class="muted text-sm" style="margin:0">Московское время · Europe/Moscow</p>${state.scheduleMode==='day'?`<div class="day-strip">${days.map((d,i)=>`<button class="day-btn ${state.scheduleDate===d?'selected':''}" data-day="${d}" aria-pressed="${state.scheduleDate===d}"><span>${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'][i]}</span><strong>${parseDate(d).getDate()}</strong></button>`).join('')}</div>${dayHtml(state.scheduleDate)}`:`<p class="week-note">Неделя целиком · выберите заголовок дня, чтобы открыть его отдельно</p>${days.map(d=>`<div class="row between" style="margin-top:20px"><div style="flex:1">${dayHtml(d)}</div><button class="btn ghost small" data-day="${d}" style="align-self:flex-start;margin-top:28px">Открыть день</button></div>`).join('')}`}`}
function academicsPage(){return header('Успеваемость','Осенний семестр 2026/2027')+`<div class="section-title"><h2>Текущие дисциплины</h2>${chip(courses.length+' дисциплин')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Дисциплина</th><th>Баллы</th><th>Оценено работ</th><th>Детали</th></tr></thead><tbody>${courses.map(c=>`<tr><td><strong>${c[0]}</strong></td><td><span class="metric">${c[1]} <span class="max">/ ${c[2]}</span></span>${c[3]===0?'<small class="muted">Не выставлено</small>':''}</td><td><strong>${c[3]}</strong> из ${c[4]}</td><td><button class="link" data-nav="course">Открыть дисциплину ${icon('arrow','sm')}</button></td></tr>`).join('')}</tbody></table></div><div class="section-title"><h2>Сессия</h2><span class="muted">Результаты аттестации</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Дисциплина</th><th>Аттестация</th><th>Результат</th></tr></thead><tbody>${courses.map(c=>`<tr><td><strong>${c[0]}</strong></td><td>${c[5]}</td><td>${chip('Не выставлено')}</td></tr>`).join('')}</tbody></table></div>`}
function coursePage(){return header('Введение в зельеварение','ПЗ-101 · Осенний семестр 2026/2027','СТРАНИЦА ДИСЦИПЛИНЫ',`<button class="back" data-nav="academics">${icon('left','sm')} Успеваемость</button>`)+`<div class="grid3"><div class="card pad"><div class="muted text-sm">Набрано баллов</div><div class="metric" style="font-size:29px;margin:8px 0">44 <span class="max">/ 60</span></div><div class="muted text-sm">6 из 8 работ оценено</div></div><div class="card pad"><div class="muted text-sm">Посещаемость</div><div class="metric" style="font-size:29px;margin:8px 0">8 <span class="max">/ 10</span></div><div class="muted text-sm">Отмеченных занятий</div></div><div class="card pad"><div class="muted text-sm">Итоговая аттестация</div><div style="margin:15px 0">${chip('Не выставлено')}</div><div class="muted text-sm">Зачёт</div></div></div><div class="section-title"><h2>Сведения по дисциплине</h2></div><div class="tabbar" style="margin-bottom:18px">${[['works','Работы и баллы'],['attendance','Посещаемость'],['announcements','Объявления']].map(([id,n])=>`<button class="tab ${state.courseTab===id?'active':''}" data-course-tab="${id}">${n}</button>`).join('')}</div>${state.courseTab==='works'?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Работа</th><th>Тип</th><th>Дата</th><th>Баллы</th></tr></thead><tbody>${[['Лабораторная работа № 1','Лабораторная','10.09.2026','8 / 10'],['Контрольная работа № 1','Контрольная','25.09.2026','9 / 10'],['Практическая работа № 1','Практическая','08.10.2026','7 / 10'],['Лабораторная работа № 2','Лабораторная','22.10.2026','10 / 10'],['Практическая работа № 2','Практическая','05.11.2026','10 / 10'],['Лабораторная работа № 3','Лабораторная','19.11.2026','—']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td><strong>${x[3]}</strong></td></tr>`).join('')}</tbody></table></div>`:state.courseTab==='attendance'?`<div class="grid2">${['12 ноября','5 ноября','29 октября','22 октября','15 октября','8 октября'].map((x,i)=>`<div class="list-card"><div class="left">${icon('calendar')}<div><h3>${x} 2026</h3><p>Лабораторное занятие</p></div></div>${chip(i===3?'Отсутствие':'Присутствие',i===3?'orange':'green',true)}</div>`).join('')}</div>`:`<div class="stack">${[['19 ноября','Изменение времени лабораторной работы','Практическое занятие перенесено на 23 ноября.'],['11 ноября','Материалы к следующей работе','Подготовьте результаты предыдущих лабораторных измерений.']].map(x=>`<article class="card pad"><small class="muted">${x[0]} 2026 · Преподаватель</small><h2 style="margin:10px 0">${x[1]}</h2><p style="margin:0">${x[2]}</p></article>`).join('')}</div>`}`}
function servicesPage(){return header('Услуги и документы','Оформление заявлений и отслеживание их статуса')+`<div class="tabbar services-tabbar" data-selected="${state.servicesTab}" role="group" aria-label="Разделы услуг"><button class="tab ${state.servicesTab==='catalog'?'active':''}" data-service-tab="catalog">Каталог услуг</button><button class="tab ${state.servicesTab==='applications'?'active':''}" data-service-tab="applications">Мои заявления</button></div><div class="services-stage">${state.servicesTab==='catalog'?`<p style="margin:8px 0 20px">Выберите доступную услугу.</p><div class="grid2">${serviceData.map(s=>`<article class="card service-card"><div class="soft-square">${icon('file','lg')}</div><div><h2>${s.name}</h2><p>${s.desc}</p><div>${s.chips.map(c=>chip(c)).join('')}</div>${!s.active?`<p class="hint">Ответственное подразделение бухгалтерии не настроено однозначно.</p>`:''}<details><summary>Требования к услуге</summary><p>${s.help}</p></details><button class="btn" style="margin-top:18px" data-service="${s.id}" ${s.active?'':'disabled'}>${s.active?`Подать заявление ${icon('arrow','sm')}`:'Пока недоступно'}</button></div></article>`).join('')}</div>`:applicationsList()}</div>`}
function applicationsList(){return `<div class="section-title" style="margin-top:3px"><h2>Мои заявления</h2>${chip(state.applications.length+' заявления')}</div><div class="card" style="overflow:hidden">${state.applications.map(a=>`<a href="#application-detail" data-app="${a.id}" class="app-row"><span class="soft-square">${icon('file')}</span><div class="app-body"><h3>${a.name} · № ${a.id}</h3><p>Подано ${a.created}</p></div><div class="end">${statusChip(a.status)}${icon('right')}</div></a>`).join('')}</div>`}
function serviceForm(){const s=serviceData.find(x=>x.id===state.formType)||serviceData[3];return header(`Заявление: ${s.name}`,s.desc,'УСЛУГИ И ДОКУМЕНТЫ',`<button data-nav="services" class="back">${icon('left','sm')} Каталог услуг</button>`)+`<form class="card pad-lg" id="service-submit" style="max-width:900px"><div class="notice" style="margin-bottom:22px">${icon('info')}<div><strong>Демонстрационная форма</strong><p>Данные сохраняются только в рамках открытой страницы. Настоящая заявка не отправляется.</p></div></div><div class="form-grid">${s.id==='study_certificate'?`<div class="field wide"><label for="place">Место предоставления *</label><textarea class="control" id="place" required maxlength="300" placeholder="Например, по месту требования"></textarea><div class="hint">От 1 до 300 символов</div></div>`:s.id==='academic_leave'?`${select('leave-reason','Основание',['Медицинские обстоятельства','Семейные обстоятельства','Другое'],'Семейные обстоятельства')}<div></div>${field('leave-start','Дата начала','required','2026-12-01','date')}${field('leave-end','Дата окончания','required','2027-01-31','date')}<div class="field wide"><label for="leave-details">Пояснение</label><textarea class="control" id="leave-details" placeholder="Кратко опишите обстоятельства"></textarea></div><div class="field wide"><label for="leave-file">Подтверждающий документ *</label><input class="control" id="leave-file" type="file" accept=".pdf,.png,.jpg,.jpeg" required><div class="hint">Для демо достаточно выбрать файл, загрузка на сервер не происходит.</div></div>`:s.id==='accounting_certificate'?field('purpose','Цель получения (необязательно)','','','text'):`<div class="wide">${chip('Текущий учебный период · Осенний семестр 2026/2027')}</div>`}</div><div class="form-footer"><button class="btn light" type="button" data-nav="services">Отмена</button><button class="btn" type="submit">Отправить заявление ${icon('arrow','sm')}</button></div></form>`}
function applicationDetail(){let a=state.applications.find(x=>x.id===state.selectedApp)||state.applications[0];return header(`Заявление № ${a.id}`,a.name,'УСЛУГИ И ДОКУМЕНТЫ',`<button class="back" data-action="open-applications">${icon('left','sm')} Мои заявления</button>`)+`<div class="split"><section class="card pad-lg"><h2>Сведения о заявлении</h2><dl class="details"><div><dt>Услуга</dt><dd>${a.name}</dd></div><div><dt>Дата подачи</dt><dd>${a.created}</dd></div><div><dt>Статус</dt><dd>${statusChip(a.status)}</dd></div><div><dt>Номер заявления</dt><dd>№ ${a.id}</dd></div><div><dt>Сведения</dt><dd>${esc(a.detail)}</dd></div></dl>${a.status==='Одобрено'?`<div class="btn-row" style="margin-top:25px">${button(`${icon('download','sm')} Скачать PDF (демо)`,'download-doc')}</div>`:''}</section><aside class="card pad"><h2>История рассмотрения</h2><ol class="timeline"><li><strong>Заявление отправлено</strong><small>${a.created} · Студент</small></li><li><strong>${a.status==='Одобрено'?'Заявление одобрено':'Получено на рассмотрение'}</strong><small>Обновление статуса</small></li></ol></aside></div>`}
function newsPage(){return header('Новости','Университетские объявления и важная информация')+`<div class="card newsfeed">${state.newPosts.filter(n=>!n.hidden&&!n.draft).concat(news.filter(n=>!n.hidden)).map(n=>`<a href="#news-detail" class="newsitem" data-news="${n.id}"><div><time>${n.date}</time><h2>${esc(n.title)}</h2><p>${esc(n.desc)}</p></div>${icon('right')}</a>`).join('')}</div>`}

return `<div class="split"><section class="card pad-lg"><h2>Опубликовать объявление</h2><form id="announcement-form" class="stack">${field('announcement-title','Заголовок','required','','text')}<div class="field"><label for="announcement-text">Текст объявления</label><textarea id="announcement-text" class="control" required placeholder="Сообщение для студентов группы"></textarea></div><div class="form-grid"><label class="field"><span class="field-label">Аудитория</span><select class="control" id="announcement-scope"><option>Текущая группа</option><option>Все группы проведения</option></select></label><label class="pill-switch important-control"><input type="checkbox" id="announcement-important" name="important"> Важное объявление</label></div><div class="form-footer"><button class="btn" type="submit">Опубликовать объявление</button></div></form></section><aside class="card pad"><h2>Недавние объявления</h2><div class="stack"><div><small class="muted">18.11.2026</small><h3>Изменение времени лабораторной</h3><p class="muted text-sm">Занятие перенесено на 23 ноября.</p></div><div class="muted-line"></div><div><small class="muted">09.11.2026</small><h3>Материалы к практической работе</h3><p class="muted text-sm">Файлы доступны в аудитории.</p></div></div></aside></div>`}
function teacherLessonHtml(lesson) {
  if (!state.showCancelled && lesson.status === 'cancelled') return '';
  const changed = lesson.status === 'cancelled' || lesson.status === 'moved';
  const status = lesson.status === 'cancelled' ? chip('Отменено', 'red') :
    lesson.status === 'moved' ? chip('Перенесено', 'orange') : '';
  const rooms = lesson.rooms.join(', ') || 'Аудитория не указана';
  const participants = scheduleParticipantsLabel(lesson.participants);
  const movedTo = lesson.toDate && lesson.toTime
    ? `<a href="#teacher-schedule" data-teacher-jump-date="${esc(lesson.toDate)}">Перенесено на ${dateShort(lesson.toDate)}, ${esc(lesson.toTime)}</a>`
    : '';
  return `<article class="lesson ${changed ? lesson.status : ''}">
    <div class="time">${esc(lesson.start)} — ${esc(lesson.end)}</div>
    <div class="info"><h3>${esc(lesson.course)}</h3>
      ${movedTo || `<p>${esc(lesson.kind)} · ${esc(rooms)} · ${esc(participants)}</p>`}
    </div>${status}</article>`;
}
function teacherDayHtml(date, person) {
  const list = scheduleEntries().filter(lesson =>
    lesson.date === date && lesson.teacher === person &&
    (state.showCancelled || lesson.status !== 'cancelled')
  ).sort((a,b) => a.start.localeCompare(b.start));
  return `<section><h2 class="schedule-day-title">${dateLong(date)}</h2>
    ${list.length ? list.map(teacherLessonHtml).join('') :
      '<div class="card pad" style="color:var(--muted);text-align:center;padding-block:25px">На этот день занятий нет.</div>'}
  </section>`;
}
function teacherSchedule() {

  // Intentionally reuse the approved student schedule's class names and layout.
  // Only data and handlers are teacher-specific; the student page is unchanged.
  return header('Расписание', `Неделя ${Math.ceil((parseDate(start)-new Date('2026-01-01T12:00:00'))/604800000)+1} · ${dateShort(start)}–${dateShort(days[6])}`, 'КАБИНЕТ ПРЕПОДАВАТЕЛЯ')+
    `<div class="teacher-person-filter"><label for="teacher-schedule-person">Преподаватель</label>
      <select class="control" id="teacher-schedule-person">${demoTeachers.map(t =>
        `<option value="${esc(t)}" ${t===person?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="toolbar teacher-schedule-toolbar">
      <div class="left"><div class="tabbar" data-teacher-schedule-tabs role="group" aria-label="Вид расписания">
        <button class="tab ${!isWeek?'active':''}" data-teacher-schedule-mode="day" aria-pressed="${!isWeek}">День</button>

      </div>${button('Сегодня','teacher-schedule-today','light small')}</div>
      <div class="right"><button class="btn light icon-only" data-teacher-schedule-shift="-1" aria-label="Предыдущая неделя">${icon('left')}</button>
        <button class="btn light icon-only" data-teacher-schedule-shift="1" aria-label="Следующая неделя">${icon('right')}</button>
        <label for="teacher-schedule-date" class="muted">Дата</label><input id="teacher-schedule-date" class="control" type="date" value="${state.teacherScheduleDate}" style="width:160px">
      </div>
    </div>
    <div class="row wrap" style="margin:12px 0 17px"><label class="pill-switch"><input id="show-cancelled" type="checkbox" ${state.showCancelled?'checked':''}> Показывать отменённые</label></div>
    <p class="muted text-sm" style="margin:0">Московское время · Europe/Moscow</p>
    <div class="teacher-schedule-list">${!isWeek ?
      `<div class="day-strip">${days.map((date,i) =>
        `<button class="day-btn ${state.teacherScheduleDate===date?'selected':''}" data-teacher-day="${date}" aria-pressed="${state.teacherScheduleDate===date}">
          <span>${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'][i]}</span><strong>${parseDate(date).getDate()}</strong>
        </button>`).join('')}</div>${teacherDayHtml(state.teacherScheduleDate,person)}` :
      `<p class="week-note">Неделя целиком · выберите заголовок дня, чтобы открыть его отдельно</p>
      ${days.map(date => `<div class="row between" style="margin-top:20px"><div style="flex:1">${teacherDayHtml(date,person)}</div>
        <button class="btn ghost small" data-teacher-day="${date}" style="align-self:flex-start;margin-top:28px">Открыть день</button></div>`).join('')}`}</div>
    <p class="hint" style="margin-top:18px">Демонстрационное расписание преподавателя. В рабочем main маршрут /teacher/schedule пока не реализован.</p>`;
}

// Animate ONLY the content that changed, never #main-content or the shell.
// A stable layout is more important than a height tween that moves the whole viewport.
function morphContent(node, html) {
  if (!node || node.innerHTML === html) return;
  node.getAnimations().forEach(animation => animation.cancel());
  node.innerHTML = html;
  if (!motionReduced()) {
    node.animate([{opacity: .66}, {opacity: 1}], {
      duration: 170, easing: v5Ease
    });
  }
}
function syncServiceIndicator() {
  document.querySelectorAll('.services-tabbar, .mvp2-tabs, .mvp2-segmented').forEach(bar => {
    const active = bar.querySelector('.tab.active, .segment.active');
    if (!active) return;
    // These two initial properties are applied while ::before has transition:none.
    // No animation is enabled until the browser has painted the initial position.
    bar.style.setProperty('--tab-x',active.offsetLeft + 'px');
    bar.style.setProperty('--tab-width',active.offsetWidth + 'px');
    if (!bar.dataset.indicatorInitialized) {
      bar.dataset.indicatorInitialized = 'pending';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (!bar.isConnected) return;
        bar.dataset.indicatorInitialized = 'ready';
        bar.classList.add('indicator-ready');
      }));
    }
    if (bar.classList.contains('mvp2-tabs') && bar.scrollWidth > bar.clientWidth) {
      const left = active.offsetLeft, right = left + active.offsetWidth;
      const visibleStart = bar.scrollLeft, visibleEnd = visibleStart + bar.clientWidth;
      let next = visibleStart;
      if (left < visibleStart + 8) next = Math.max(0,left-8);
      else if (right > visibleEnd - 8) next = right-bar.clientWidth+8;
      if (Math.abs(next-visibleStart)>1) bar.scrollTo({left:next,behavior:'auto'});
    }
  });
}

function syncActiveControls(oldBar, newBar) {

function patchNode(oldRoot, nextRoot, selector, { contentOnly = false, animate = false } = {}) {
  const oldNode = oldRoot.querySelector(selector), newNode = nextRoot.querySelector(selector);

  if (contentOnly) {
    if (animate) morphContent(oldNode, newNode.innerHTML);
    else if (oldNode.innerHTML !== newNode.innerHTML) oldNode.innerHTML = newNode.innerHTML;
  } else if (oldNode.outerHTML !== newNode.outerHTML) {
    oldNode.replaceWith(newNode.cloneNode(true));
  }
  return true;
}
