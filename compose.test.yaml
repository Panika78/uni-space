services:
  test-db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: uni_space_test
      POSTGRES_USER: uni_space_test
      POSTGRES_PASSWORD: test-only-password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql --host="$${HOSTNAME}" --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}" --no-password --tuples-only
          --command="SELECT 1" >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
