name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  JWT_SIGNING_KEY: test-only-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint and format
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify uv.lock matches pyproject.toml
        working-directory: backend
        run: uv lock --check
      - name: Install pinned Python
        run: uv python install 3.12.16
      - name: Verify project Python version
        working-directory: backend
        run: uv run --locked --python 3.12.16 python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 16)"
      - name: Ruff lint
        working-directory: backend
        run: uv run --locked --python 3.12.16 ruff check .
      - name: Ruff format
        working-directory: backend
        run: uv run --locked --python 3.12.16 ruff format --check .

  backend-tests:
    name: Backend tests
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: uni_space_test
          POSTGRES_USER: uni_space_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uni_space_test -d uni_space_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify uv.lock matches pyproject.toml
        working-directory: backend
        run: uv lock --check
      - name: Install pinned Python
        run: uv python install 3.12.16
      - name: Verify project Python version
        working-directory: backend
        run: uv run --locked --python 3.12.16 python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 16)"
      - name: Run unit and HTTPX tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 pytest -m "not integration"
      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 pytest -m integration

  frontend-lint:
    name: Frontend ESLint and Prettier
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier
        working-directory: frontend
        run: |
          npm run format:check
          npx prettier --config .prettierrc.json --check ../deploy/spa.browser.mjs

  frontend-typecheck:
    name: Frontend TypeScript
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  frontend-tests:
    name: Frontend Vitest
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest and React Testing Library
        working-directory: frontend
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  api-types:
    name: Generated API types current
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify uv.lock matches pyproject.toml
        working-directory: backend
        run: uv lock --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Python
        run: uv python install 3.12.16
      - name: Verify project Python version
        working-directory: backend
        run: uv run --locked --python 3.12.16 python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 16)"
      - name: Check generated OpenAPI types without rewriting files
        working-directory: frontend
        run: npm run types:check

  migrations:
    name: PostgreSQL migrations at current Alembic heads
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: uni_space_test
          POSTGRES_USER: uni_space_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uni_space_test -d uni_space_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify uv.lock matches pyproject.toml
        working-directory: backend
        run: uv lock --check
      - name: Install pinned Python
        run: uv python install 3.12.16
      - name: Verify project Python version
        working-directory: backend
        run: uv run --locked --python 3.12.16 python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 16)"
      - name: Apply migrations to empty PostgreSQL
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 alembic upgrade head
      - name: Verify repeated migration upgrade
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 alembic upgrade head
      - name: Check ORM metadata against PostgreSQL schema
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 alembic check
      - name: Verify database matches current Alembic heads
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
        run: uv run --locked --python 3.12.16 python scripts/check_migrations.py

  db-healthcheck:
    name: Compose PostgreSQL healthcheck regression
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Compose healthcheck regression
        run: bash backend/tests/test_compose_db_healthcheck.sh

  services-browser-e2e:
    name: Services browser E2E (two test students)
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: uni_space_test
          POSTGRES_USER: uni_space_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uni_space_test -d uni_space_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
      API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm and frontend dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1
          npm ci
      - name: Install pinned Python and browser tooling
        run: |
          uv python install 3.12.16
          mkdir -p work/browser-tooling
          npm install --prefix work/browser-tooling --no-save --package-lock=false playwright@1.57.0
          node work/browser-tooling/node_modules/playwright/cli.js install chromium --only-shell
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/work/browser-tooling/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Apply migrations and create two fictional students
        run: |
          uv run --locked --python 3.12.16 --project backend alembic -c backend/alembic.ini upgrade head
          uv run --locked --python 3.12.16 --project backend python backend/scripts/seed_services_browser_test_students.py >> "$GITHUB_ENV"
      - name: Start real API and frontend
        run: |
          (cd backend && uv run --locked --python 3.12.16 uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../work/services-api.log 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 > ../work/services-frontend.log 2>&1) &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/api/openapi.json >/dev/null && curl --silent --fail http://127.0.0.1:5173/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat work/services-api.log work/services-frontend.log
          exit 1
      - name: Run notification drawer Chromium regression
        run: |
          AUTH_TEST_LOGIN_A="$SERVICES_TEST_LOGIN" \
          AUTH_TEST_PASSWORD="$SERVICES_TEST_PASSWORD" \
          node frontend/e2e/notifications.browser.mjs
      - name: Run services catalog and application browser E2E
        run: node frontend/e2e/services.browser.mjs
      - name: Show server logs on failure
        if: failure()
        run: tail -n 80 work/services-api.log work/services-frontend.log 2>/dev/null || true

  production-deployment:
    name: Production Compose HTTPS and recovery
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest may select 26.04.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install isolated browser test tooling
        run: |
          mkdir -p work/browser-tooling
          if ! (
            npm install --prefix work/browser-tooling --no-save --package-lock=false playwright@1.57.0 &&
            node work/browser-tooling/node_modules/playwright/cli.js install chromium --only-shell
          ) > work/browser-install.log 2>&1; then
            cat work/browser-install.log
            tail -n 20 work/browser-install.log | sed 's/%/%25/g;s/\r/%0D/g;s/^/::error title=Browser tooling::/'
            exit 1
          fi
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/work/browser-tooling/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build production API and SPA images
        run: |
          docker build -f backend/Dockerfile -t uni-space-api:task019 .
          docker build -f deploy/Dockerfile.web -t uni-space-web:task019 .
      - name: Check deployment test formatting
        run: |
          uv run --locked --python 3.12.16 --project backend ruff check deploy/test_production.py deploy/schedule_fixtures.py
          uv run --locked --python 3.12.16 --project backend ruff format --check deploy/test_production.py deploy/schedule_fixtures.py
          node --check deploy/spa.browser.mjs
      - name: Test isolated HTTPS deployment and backup recovery
        run: |
          mkdir -p work
          if ! uv run --locked --python 3.12.16 --project backend python deploy/test_production.py > work/production-test.log 2>&1; then
            cat work/production-test.log
            # The parent test prints assertions/commands, never child stderr or token values.
            # One annotation avoids GitHub's per-step limit on individual errors.
            python3 -c 'from pathlib import Path; text="\n".join(Path("work/production-test.log").read_text().splitlines()[-25:]); print("::error title=Production integration::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          cat work/production-test.log

  schedule-browser:
    name: Student schedule in Chromium
    runs-on: [self-hosted, linux, x64]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://uni_space_test:test-only-password@localhost:5432/uni_space_test
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: uni_space_test
          POSTGRES_USER: uni_space_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uni_space_test -d uni_space_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated application and browser fixtures
        run: |
          npm install --global npm@11.19.1
          npm ci --prefix frontend
          uv python install 3.12.16
          uv sync --locked --project backend --python 3.12.16
          (cd backend && uv run --locked --python 3.12.16 alembic upgrade head)
          printf '%s' 'fictional-schedule-password' | PYTHONPATH=backend uv run --locked --python 3.12.16 --project backend python deploy/schedule_fixtures.py
          mkdir -p work/browser-tooling
          npm install --prefix work/browser-tooling --no-save --package-lock=false playwright@1.57.0
          node work/browser-tooling/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Run real schedule browser scenarios
        run: |
          (cd backend && exec .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000) > work/api.log 2>&1 &
          api_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host 0.0.0.0) > work/vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/openapi.json >/dev/null && curl -fsS http://localhost:5173 >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/work/browser-tooling/node_modules/playwright/index.mjs SCHEDULE_TEST_PASSWORD=fictional-schedule-password node frontend/e2e/schedule.browser.mjs
